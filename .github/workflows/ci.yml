name: Aegis Command CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  frontend:
    name: Frontend CI (Test, Typecheck, Lint, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests (Vitest)
        run: npm test -- --run

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit

      - name: Lint (ESLint)
        run: npx eslint src

      - name: Production Build (Next.js Turbopack)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  python-tests:
    name: Vision & Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r vision/requirements.txt -r vision/requirements-dev.txt

      - name: Run Backend AI Layer & Honest Retrieval Tests
        run: |
          LOW_MEMORY_MODE=true pytest backend/
        env:
          LOW_MEMORY_MODE: "true"

      - name: Run Vision Verification Tests
        run: |
          pytest vision/tests/
